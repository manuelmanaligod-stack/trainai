<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TrainAI">
<title>TrainAI</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { background:#f5f5f0; color:#1a1a1a; font-family:'DM Sans',sans-serif; min-height:100vh; }
.page { max-width:430px; margin:0 auto; padding-bottom:100px; }

/* Header */
.hdr { background:#fff; padding:max(env(safe-area-inset-top),20px) 18px 0; border-bottom:1px solid #ebebeb; }
.hdr-top { display:flex; align-items:center; justify-content:space-between; padding-bottom:12px; }
.logo { display:flex; align-items:center; gap:9px; }
.logo-dot { width:9px; height:9px; border-radius:50%; background:#FC4C02; }
.logo-name { font-size:16px; font-weight:600; letter-spacing:-.3px; }
.logo-name span { color:#FC4C02; }
.logo-sub { font-size:11px; color:#bbb; margin-top:1px; }
.go-btn { background:#FC4C02; color:#fff; border:none; border-radius:18px; padding:7px 16px; font-family:'DM Sans',sans-serif; font-size:13px; font-weight:500; cursor:pointer; }
.go-btn:active { opacity:.8; }
.go-btn:disabled { opacity:.45; cursor:not-allowed; }

/* Tabs */
.tabs { display:flex; gap:0; }
.tab { flex:1; padding:10px 0 11px; font-size:13px; font-weight:500; color:#aaa; text-align:center; cursor:pointer; border-bottom:2px solid transparent; transition:all .2s; }
.tab.active { color:#FC4C02; border-bottom-color:#FC4C02; }

/* Progress bar */
.prog { height:2px; background:#f0ede8; display:none; }
.prog.on { display:block; }
.prog-fill { height:100%; background:#FC4C02; animation:prog 1.8s ease-in-out infinite; }
@keyframes prog { 0%{width:0%;margin-left:0} 50%{width:60%;margin-left:20%} 100%{width:0%;margin-left:100%} }
.prog-msg { text-align:center; padding:9px; font-size:11px; color:#bbb; display:none; }
.prog-msg.on { display:block; }

/* Error */
.err { margin:12px 16px; background:#fff5f5; border:1px solid #ffd0d0; border-radius:10px; padding:11px 14px; font-size:12px; color:#c0392b; display:none; }
.err.on { display:block; }

/* Summary card */
.sum-card { margin:14px 16px 0; background:#fff; border-radius:14px; border:1px solid #ebebeb; overflow:hidden; }
.sum-top { padding:14px 16px 12px; border-bottom:1px solid #f5f5f5; }
.sum-label { font-size:10px; font-weight:500; color:#bbb; text-transform:uppercase; letter-spacing:.8px; margin-bottom:10px; }
.sum-stats { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
.sstat { text-align:center; background:#f9f9f9; border-radius:8px; padding:8px 4px; }
.sstat-v { font-size:18px; font-weight:600; color:#1a1a1a; line-height:1; }
.sstat-l { font-size:9px; color:#bbb; margin-top:2px; text-transform:uppercase; letter-spacing:.4px; }

/* Zone summary — individual rows */
.sum-zones { padding:12px 16px 14px; }
.sz-label { font-size:10px; font-weight:500; color:#bbb; text-transform:uppercase; letter-spacing:.8px; margin-bottom:10px; }
.sz-rows { display:flex; flex-direction:column; gap:6px; }
.sz-row { display:flex; align-items:center; gap:8px; }
.sz-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.sz-name { font-size:11px; color:#999; width:76px; flex-shrink:0; }
.sz-track { flex:1; height:10px; background:#f0ede8; border-radius:5px; overflow:hidden; }
.sz-fill { height:100%; border-radius:5px; }
.sz-time { font-size:11px; font-weight:500; color:#444; width:38px; text-align:right; flex-shrink:0; }
.sz-pct { font-size:10px; color:#ccc; width:28px; text-align:right; flex-shrink:0; }

/* Section header */
.sec-hdr { padding:16px 16px 8px; display:flex; align-items:center; justify-content:space-between; }
.sec-title { font-size:10px; font-weight:500; color:#bbb; text-transform:uppercase; letter-spacing:.8px; }
.sec-count { font-size:11px; color:#ccc; }

/* Activity card */
.act { margin:0 16px 9px; background:#fff; border-radius:14px; border:1px solid #ebebeb; overflow:hidden; }
.act-top { padding:12px 14px 10px; display:flex; align-items:center; gap:10px; }
.act-icon { width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
.act-info { flex:1; min-width:0; }
.act-name { font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#1a1a1a; }
.act-meta { font-size:11px; color:#bbb; margin-top:1px; }
.act-hr { text-align:right; flex-shrink:0; }
.act-hr-v { font-size:18px; font-weight:600; line-height:1; }
.act-hr-l { font-size:9px; color:#ccc; }

/* Zone bar */
.act-zbar { height:10px; display:flex; background:#f5f5f5; }
.act-zseg { height:100%; }

/* Zone rows — thicker */
.act-zones { padding:9px 14px 13px; border-top:1px solid #f8f8f8; }
.zrow { display:flex; align-items:center; gap:7px; padding:3.5px 0; }
.zrow-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.zrow-name { font-size:10px; color:#aaa; width:72px; flex-shrink:0; }
.zrow-track { flex:1; height:8px; background:#f0ede8; border-radius:4px; overflow:hidden; }
.zrow-fill { height:100%; border-radius:4px; }
.zrow-time { font-size:10px; font-weight:500; color:#555; width:30px; text-align:right; flex-shrink:0; }
.zrow-pct { font-size:10px; color:#ccc; width:24px; text-align:right; flex-shrink:0; }

/* Per-workout summary */
.act-sum { padding:8px 14px 11px; border-top:1px solid #f8f8f8; font-size:12px; color:#777; line-height:1.55; }
.act-sum b { color:#444; font-weight:500; }

.est-note { font-size:9px; color:#ddd; padding-top:4px; }

/* AI analysis */
.ai-card { margin:0 16px 10px; background:#fff; border-radius:14px; border:1px solid #ebebeb; padding:15px; }
.ai-header { display:flex; align-items:center; gap:8px; margin-bottom:11px; }
.ai-title { font-size:10px; font-weight:500; color:#bbb; text-transform:uppercase; letter-spacing:.8px; }
.ai-pill { background:#fff3ee; color:#FC4C02; font-size:9px; font-weight:500; padding:2px 7px; border-radius:8px; }
.ai-body { font-size:13px; color:#555; line-height:1.75; }
.ai-body .h2 { font-size:13px; font-weight:600; color:#1a1a1a; margin:12px 0 3px; display:block; }
.ai-body .h2:first-child { margin-top:0; }
.refresh { width:100%; background:transparent; border:1px solid #ebebeb; color:#ccc; border-radius:9px; padding:10px; font-family:'DM Sans',sans-serif; font-size:12px; cursor:pointer; margin-top:9px; }

.footer { text-align:center; padding:16px 0; font-size:10px; color:#ddd; }
.footer span { color:#FC4C02; }
</style>
</head>
<body>
<div class="page">

  <div class="hdr">
    <div class="hdr-top">
      <div class="logo">
        <div class="logo-dot"></div>
        <div>
          <div class="logo-name">Train<span>AI</span></div>
          <div class="logo-sub">Strava · Apple Watch</div>
        </div>
      </div>
      <button class="go-btn" id="mainBtn" onclick="analyze()">Analyze</button>
    </div>
    <div class="tabs">
      <div class="tab active" id="tabWeek" onclick="switchTab('week')">This week</div>
      <div class="tab" id="tabMonth" onclick="switchTab('month')">This month</div>
      <div class="tab" id="tabAll" onclick="switchTab('all')">All recent</div>
    </div>
  </div>

  <div class="prog" id="prog"><div class="prog-fill"></div></div>
  <div class="prog-msg" id="progMsg">Loading...</div>
  <div class="err" id="err"></div>

  <!-- Summary -->
  <div id="sumCard" style="display:none">
    <div class="sum-card">
      <div class="sum-top">
        <div class="sum-label" id="sumLabel">This week</div>
        <div class="sum-stats">
          <div class="sstat"><div class="sstat-v" id="sWorkouts">—</div><div class="sstat-l">workouts</div></div>
          <div class="sstat"><div class="sstat-v" id="sKm">—</div><div class="sstat-l">km run</div></div>
          <div class="sstat"><div class="sstat-v" id="sMins">—</div><div class="sstat-l">minutes</div></div>
          <div class="sstat"><div class="sstat-v" id="sStrength">—</div><div class="sstat-l">strength</div></div>
        </div>
      </div>
      <div class="sum-zones">
        <div class="sz-label">Total time in HR zones</div>
        <div class="sz-rows" id="szRows"></div>
      </div>
    </div>
  </div>

  <!-- Activities -->
  <div id="actsWrap" style="display:none">
    <div class="sec-hdr">
      <div class="sec-title">Workouts</div>
      <div class="sec-count" id="actCount"></div>
    </div>
    <div id="actsList"></div>
  </div>

  <!-- AI -->
  <div id="aiWrap" style="display:none">
    <div class="sec-hdr"><div class="sec-title">AI coach</div></div>
    <div class="ai-card">
      <div class="ai-header">
        <div class="ai-title">Your analysis</div>
        <div class="ai-pill">Groq · Llama 3.3</div>
      </div>
      <div class="ai-body" id="aiBody"></div>
      <button class="refresh" onclick="analyze()">Refresh</button>
    </div>
  </div>

  <div class="footer" id="footer" style="display:none">Made for <span>Carlo</span> · TrainAI v7.0</div>
</div>

<script>
const ZC  = ['#3b82f6','#10b981','#f59e0b','#f97316','#ef4444'];
const ZN  = ['Recovery','Endurance','Tempo','Threshold','Max'];
const ZB  = [0,124,154,169,184,999];
const WI  = {Run:'🏃',Walk:'🚶',WeightTraining:'🏋️',Ride:'🚴',Hike:'🥾',Swim:'🏊'};
const WBg = {Run:'#fff5f0',Walk:'#f0f5ff',WeightTraining:'#f0fff8',Ride:'#fffbf0',Hike:'#f5fff0'};
const STEPS = ['Fetching Strava...','Processing workouts...','Computing HR zones...','Running AI analysis...','Almost done...'];

let allActivities = [], allAnalysis = '', currentTab = 'week';

function fmtTime(s) {
  if (!s||s<30) return '';
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);
  return h>0?`${h}h ${m}m`:`${m}m`;
}

function getZone(hr) {
  if (!hr) return -1;
  for (let i=0;i<5;i++) if (hr>=ZB[i]&&hr<ZB[i+1]) return i;
  return 4;
}

function estimateZones(avgHr, durationMins) {
  if (!avgHr||!durationMins) return null;
  const z = getZone(avgHr);
  const zmin = ZB[z];
  const zmax = ZB[z+1] < 500 ? ZB[z+1] : ZB[z]+20;
  const pos = (avgHr - zmin) / (zmax - zmin); // 0=bottom, 1=top of zone

  // Calibrated model based on real Apple Watch data:
  // - Low pos in zone → more spillover below
  // - High pos in zone → more spillover above
  // - Calibrated against real 130bpm (Z2) and 159bpm (Z3) runs
  const w = [0,0,0,0,0];
  const mainW = 0.75 + Math.abs(pos - 0.5) * 0.1;
  const remaining = 1.0 - mainW;
  const spillDown = remaining * (1.0 - pos);
  const spillUp   = remaining * pos;

  w[z] = mainW;
  if (z > 0) w[z-1] += spillDown; else w[z] += spillDown;
  if (z < 4) w[z+1] += spillUp;   else w[z] += spillUp;

  const total = durationMins * 60;
  return w.map(v => Math.round(v * total));
}

function filterByTab(acts) {
  const now = new Date();
  if (currentTab==='week') {
    const weekAgo = new Date(now); weekAgo.setDate(now.getDate()-7);
    return acts.filter(a=>new Date(a.date)>=weekAgo);
  }
  if (currentTab==='month') {
    const monthAgo = new Date(now); monthAgo.setDate(now.getDate()-30);
    return acts.filter(a=>new Date(a.date)>=monthAgo);
  }
  return acts;
}

function switchTab(tab) {
  currentTab = tab;
  ['week','month','all'].forEach(t => {
    document.getElementById('tab'+t.charAt(0).toUpperCase()+t.slice(1))
      .classList.toggle('active', t===tab);
  });
  if (allActivities.length > 0) renderAll(allActivities, allAnalysis);
}

function renderSummary(acts) {
  const labels = {week:'This week',month:'This month',all:'All recent'};
  document.getElementById('sumLabel').textContent = labels[currentTab];

  const runs = acts.filter(a=>a.sport==='Run');
  const wts  = acts.filter(a=>a.sport==='WeightTraining');
  const km   = runs.reduce((s,a)=>s+a.distance,0);
  const mins = acts.reduce((s,a)=>s+a.duration,0);

  document.getElementById('sWorkouts').textContent = acts.length;
  document.getElementById('sKm').textContent = km.toFixed(1);
  document.getElementById('sMins').textContent = Math.round(mins);
  document.getElementById('sStrength').textContent = wts.length;

  const totals = [0,0,0,0,0];
  acts.forEach(a => {
    const est = estimateZones(a.avg_hr, a.duration);
    if (est) est.forEach((t,i)=>totals[i]+=t);
  });
  const grand = totals.reduce((s,t)=>s+t,0)||1;
  const maxT = Math.max(...totals, 1);

  document.getElementById('szRows').innerHTML = totals.map((t,i) => {
    if (t < 30) return '';
    const pct = Math.round(t/grand*100);
    const bw  = Math.round(t/maxT*100);
    return `<div class="sz-row">
      <div class="sz-dot" style="background:${ZC[i]}"></div>
      <div class="sz-name">Z${i+1} ${ZN[i]}</div>
      <div class="sz-track"><div class="sz-fill" style="width:${bw}%;background:${ZC[i]}"></div></div>
      <div class="sz-time">${fmtTime(t)}</div>
      <div class="sz-pct">${pct}%</div>
    </div>`;
  }).filter(Boolean).join('');

  document.getElementById('sumCard').style.display='block';
}

function renderActivities(acts) {
  document.getElementById('actCount').textContent = `${acts.length} workouts`;
  document.getElementById('actsList').innerHTML = acts.map(a=>{
    const icon   = WI[a.sport]||'🏃';
    const bg     = WBg[a.sport]||'#f9f9f9';
    const zone   = getZone(a.avg_hr);
    const hrClr  = a.avg_hr ? ZC[zone] : '#ccc';
    const dist   = a.distance>0?`${a.distance}km · `:'';
    const zt     = estimateZones(a.avg_hr, a.duration);
    const total  = zt?zt.reduce((s,t)=>s+t,0):0;
    const maxT   = zt?Math.max(...zt,1):1;

    const barSegs = zt&&total>0
      ? zt.map((t,i)=>{const p=t/total*100;return p>0.5?`<div class="act-zseg" style="flex:${p};background:${ZC[i]}"></div>`:''}).join('')
      : '';

    const zrows = zt&&total>0
      ? zt.map((t,i)=>{
          if(t<30) return '';
          const p=Math.round(t/total*100),bw=Math.round(t/maxT*100);
          return `<div class="zrow">
            <div class="zrow-dot" style="background:${ZC[i]}"></div>
            <div class="zrow-name">Z${i+1} ${ZN[i]}</div>
            <div class="zrow-track"><div class="zrow-fill" style="width:${bw}%;background:${ZC[i]}"></div></div>
            <div class="zrow-time">${fmtTime(t)}</div>
            <div class="zrow-pct">${p}%</div>
          </div>`;
        }).filter(Boolean).join('')
      : '';

    // Per-workout summary sentence
    let sumParts = [];
    if (a.sport==='Run'&&a.distance>0) {
      const pace = (a.duration/a.distance).toFixed(1);
      sumParts.push(`<b>${a.distance}km</b> at <b>${pace} min/km</b>`);
    }
    if (a.avg_hr) sumParts.push(`avg HR <b style="color:${hrClr}">${Math.round(a.avg_hr)} bpm</b> — ${ZN[zone]}`);
    if (zt&&total>0) {
      const topIdx=zt.indexOf(Math.max(...zt));
      const topPct=Math.round(zt[topIdx]/total*100);
      sumParts.push(`${topPct}% in <b>${ZN[topIdx]}</b>`);
    }

    return `
      <div class="act">
        <div class="act-top">
          <div class="act-icon" style="background:${bg}">${icon}</div>
          <div class="act-info">
            <div class="act-name">${a.name}</div>
            <div class="act-meta">${a.date} · ${dist}${Math.round(a.duration)} min</div>
          </div>
          ${a.avg_hr?`<div class="act-hr">
            <div class="act-hr-v" style="color:${hrClr}">${Math.round(a.avg_hr)}</div>
            <div class="act-hr-l">avg bpm</div>
          </div>`:''}
        </div>
        ${barSegs?`<div class="act-zbar">${barSegs}</div>`:''}
        ${zrows?`<div class="act-zones">${zrows}<div class="est-note">⚡ Estimated from avg HR</div></div>`:''}
        ${sumParts.length?`<div class="act-sum">${sumParts.join(' · ')}</div>`:''}
      </div>`;
  }).join('');
  document.getElementById('actsWrap').style.display='block';
}

function renderAll(acts, analysis) {
  const filtered = filterByTab(acts);
  document.getElementById('sumCard').style.display='none';
  document.getElementById('actsWrap').style.display='none';
  document.getElementById('aiWrap').style.display='none';

  if (filtered.length===0) {
    document.getElementById('err').textContent = 'No workouts found for this period.';
    document.getElementById('err').classList.add('on');
    return;
  }
  document.getElementById('err').classList.remove('on');
  renderSummary(filtered);
  renderActivities(filtered);
  document.getElementById('aiBody').innerHTML = mdToHtml(analysis);
  document.getElementById('aiWrap').style.display='block';
  document.getElementById('footer').style.display='block';
}

function mdToHtml(txt) {
  return txt
    .replace(/^#{1,3} (.+)/gm,'<span class="h2">$1</span>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/^[\-\*] /gm,'• ')
    .replace(/\n/g,'<br>');
}

async function analyze() {
  const btn = document.getElementById('mainBtn');
  btn.disabled=true;
  document.getElementById('prog').classList.add('on');
  document.getElementById('progMsg').classList.add('on');
  document.getElementById('err').classList.remove('on');
  document.getElementById('sumCard').style.display='none';
  document.getElementById('actsWrap').style.display='none';
  document.getElementById('aiWrap').style.display='none';
  document.getElementById('footer').style.display='none';

  let si=0;
  const msgEl=document.getElementById('progMsg');
  msgEl.textContent=STEPS[0];
  const timer=setInterval(()=>{msgEl.textContent=STEPS[++si%STEPS.length];},2000);

  try {
    const res  = await fetch('/analyze',{method:'POST'});
    const data = await res.json();
    clearInterval(timer);
    document.getElementById('prog').classList.remove('on');
    document.getElementById('progMsg').classList.remove('on');

    if (data.success) {
      allActivities = data.activities;
      allAnalysis   = data.analysis;
      renderAll(allActivities, allAnalysis);
    } else {
      document.getElementById('err').textContent = data.error;
      document.getElementById('err').classList.add('on');
    }
  } catch(e) {
    clearInterval(timer);
    document.getElementById('prog').classList.remove('on');
    document.getElementById('progMsg').classList.remove('on');
    document.getElementById('err').textContent='Cannot connect to server. Make sure server_v4.py is running.';
    document.getElementById('err').classList.add('on');
  }
  btn.disabled=false;
}
</script>
</body>
</html>
