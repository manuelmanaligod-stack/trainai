<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TrainAI">
<title>TrainAI</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #FC4C02;
    --black: #0a0a0a;
    --card: #1a1a1a;
    --border: #2a2a2a;
    --text: #f0f0f0;
    --muted: #777;
    --z1: #60a5fa;
    --z2: #34d399;
    --z3: #fbbf24;
    --z4: #f97316;
    --z5: #ef4444;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--black);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(252,76,2,0.1) 0%, transparent 60%);
    pointer-events: none; z-index: 0;
  }

  .container {
    position: relative; z-index: 1;
    max-width: 480px; margin: 0 auto;
    padding: 0 16px 60px;
  }

  /* Header */
  .header {
    padding-top: max(env(safe-area-inset-top), 24px);
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 4px;
  }
  .logo-icon {
    width: 40px; height: 40px; background: var(--orange);
    border-radius: 11px; display: flex; align-items: center;
    justify-content: center; font-size: 19px;
    box-shadow: 0 4px 18px rgba(252,76,2,0.4); flex-shrink: 0;
  }
  .logo-text { font-family: 'Bebas Neue', sans-serif; font-size: 34px; letter-spacing: 2px; line-height: 1; }
  .logo-text span { color: var(--orange); }
  .subtitle { color: var(--muted); font-size: 11px; font-weight: 300; margin-bottom: 20px; }

  /* Stats */
  .stats-row {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    margin-bottom: 14px;
    opacity: 0; transform: translateY(8px);
    transition: opacity 0.4s, transform 0.4s;
  }
  .stats-row.show { opacity: 1; transform: translateY(0); }
  .stat-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 13px; padding: 11px 8px; text-align: center;
  }
  .stat-value { font-family: 'Bebas Neue', sans-serif; font-size: 24px; color: var(--orange); line-height: 1; margin-bottom: 2px; }
  .stat-label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.7px; }

  /* Button */
  .analyze-btn {
    width: 100%; background: var(--orange); color: white; border: none;
    border-radius: 15px; padding: 17px; font-family: 'Bebas Neue', sans-serif;
    font-size: 19px; letter-spacing: 2px; cursor: pointer;
    box-shadow: 0 5px 25px rgba(252,76,2,0.35); margin-bottom: 14px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: transform 0.15s;
  }
  .analyze-btn:active { transform: scale(0.97); }
  .analyze-btn:disabled { opacity: 0.55; cursor: not-allowed; }

  /* Loading */
  .loading { display: none; text-align: center; padding: 26px 0; }
  .loading.active { display: block; }
  .pulse-ring {
    width: 48px; height: 48px; border-radius: 50%;
    border: 3px solid var(--border); border-top-color: var(--orange);
    animation: spin 1s linear infinite; margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { color: var(--muted); font-size: 12px; }
  .loading-step { color: var(--orange); font-size: 11px; margin-top: 5px; font-weight: 500; }

  /* Error */
  .error-card {
    background: rgba(255,60,60,0.08); border: 1px solid rgba(255,60,60,0.2);
    border-radius: 13px; padding: 14px; color: #ff6b6b; font-size: 12px;
    display: none; margin-bottom: 14px;
  }
  .error-card.active { display: block; }

  /* Section wrapper */
  .section {
    opacity: 0; transform: translateY(8px);
    transition: opacity 0.4s, transform 0.4s;
    margin-bottom: 14px;
    display: none;
  }
  .section.show { opacity: 1; transform: translateY(0); display: block; }

  .section-title {
    font-family: 'Bebas Neue', sans-serif; font-size: 14px;
    letter-spacing: 1.5px; color: var(--muted);
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 10px;
  }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* My HR Zones legend */
  .zones-legend {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 15px; padding: 14px 16px;
  }
  .legend-row {
    display: flex; align-items: center; gap: 10px;
    padding: 5px 0;
    border-bottom: 1px solid var(--border);
  }
  .legend-row:last-child { border-bottom: none; }
  .zone-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .legend-name { font-size: 12px; font-weight: 500; flex: 1; }
  .legend-range { font-size: 11px; color: var(--muted); }

  /* Activity cards */
  .activity-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 15px; padding: 14px 16px; margin-bottom: 10px;
  }

  .activity-header {
    display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
  }
  .sport-icon {
    width: 36px; height: 36px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; flex-shrink: 0;
  }
  .activity-meta { flex: 1; min-width: 0; }
  .activity-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .activity-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .activity-hr {
    text-align: right; flex-shrink: 0;
  }
  .hr-value { font-family: 'Bebas Neue', sans-serif; font-size: 22px; }
  .hr-label { font-size: 9px; color: var(--muted); }

  /* Zone bar for each activity */
  .zone-bars { display: flex; gap: 3px; height: 10px; border-radius: 6px; overflow: hidden; }
  .zone-seg { height: 100%; transition: flex 0.6s ease; min-width: 0; }

  .zone-breakdown {
    display: flex; justify-content: space-between;
    margin-top: 6px;
  }
  .zone-chip {
    display: flex; align-items: center; gap: 3px;
    font-size: 10px; color: var(--muted);
  }
  .zone-chip-dot { width: 6px; height: 6px; border-radius: 50%; }

  /* AI Analysis */
  .analysis-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 15px; padding: 18px;
    font-size: 13px; font-weight: 300; line-height: 1.75;
    color: #ccc; word-wrap: break-word;
  }
  .ai-badge {
    background: rgba(252,76,2,0.12); border: 1px solid rgba(252,76,2,0.25);
    color: var(--orange); font-size: 9px; font-weight: 500;
    padding: 2px 7px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px;
    margin-left: 8px; vertical-align: middle;
  }

  .refresh-btn {
    width: 100%; background: transparent; border: 1px solid var(--border);
    color: var(--muted); border-radius: 11px; padding: 11px;
    font-family: 'DM Sans', sans-serif; font-size: 12px; cursor: pointer;
    margin-top: 10px; transition: all 0.2s;
  }
  .refresh-btn:hover { border-color: var(--orange); color: var(--orange); }

  .footer { text-align: center; margin-top: 20px; color: var(--muted); font-size: 10px; }
  .footer span { color: var(--orange); }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="logo-icon">🏃</div>
    <div class="logo-text">TRAIN<span>AI</span></div>
  </div>
  <div class="subtitle">Strava · HR Zone Analysis · Powered by Groq</div>

  <div class="stats-row" id="statsRow">
    <div class="stat-card">
      <div class="stat-value" id="statRuns">—</div>
      <div class="stat-label">Runs</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statKm">—</div>
      <div class="stat-label">km Run</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statSessions">—</div>
      <div class="stat-label">Sessions</div>
    </div>
  </div>

  <button class="analyze-btn" id="analyzeBtn" onclick="analyze()">⚡ ANALYZE MY TRAINING</button>

  <div class="loading" id="loading">
    <div class="pulse-ring"></div>
    <div class="loading-text">Fetching your data...</div>
    <div class="loading-step" id="loadingStep"></div>
  </div>

  <div class="error-card" id="errorCard"></div>

  <!-- HR Zones Legend -->
  <div class="section" id="zonesSection">
    <div class="section-title">MY HR ZONES</div>
    <div class="zones-legend" id="zonesLegend"></div>
  </div>

  <!-- Activities -->
  <div class="section" id="activitiesSection">
    <div class="section-title">RECENT ACTIVITIES</div>
    <div id="activitiesList"></div>
  </div>

  <!-- AI Analysis -->
  <div class="section" id="analysisSection">
    <div class="section-title">AI ANALYSIS <span class="ai-badge">Groq · Llama 3.3</span></div>
    <div class="analysis-card" id="analysisText"></div>
    <button class="refresh-btn" onclick="analyze()">🔄 Refresh Analysis</button>
  </div>

  <div class="footer">Made for <span>Carlo</span> · TrainAI v3.0</div>
</div>

<script>
const ZONE_COLORS = ['#60a5fa','#34d399','#fbbf24','#f97316','#ef4444'];
const ZONE_NAMES  = ['Recovery','Endurance','Tempo','Threshold','Max'];
const SPORT_ICONS = { Run:'🏃', Walk:'🚶', WeightTraining:'🏋️', Ride:'🚴', Hike:'🥾' };
const SPORT_COLORS = { Run:'rgba(252,76,2,0.15)', Walk:'rgba(96,165,250,0.15)', WeightTraining:'rgba(52,211,153,0.15)', Ride:'rgba(251,191,36,0.15)' };

function renderMarkdown(text) {
  return text
    .replace(/## (.+)/g, '<div style="font-family:\'Bebas Neue\',sans-serif;font-size:16px;color:#f0f0f0;letter-spacing:1px;margin:14px 0 4px">$1</div>')
    .replace(/\*\*(.+?)\*\*/g, '<strong style="color:#f0f0f0;font-weight:500">$1</strong>')
    .replace(/^- /gm, '• ')
    .replace(/\n/g, '<br>');
}

const steps = [
  "Refreshing Strava token...",
  "Fetching your activities...",
  "Loading HR zones...",
  "Fetching per-activity zones...",
  "Running AI analysis...",
  "Almost done..."
];

function fmtTime(secs) {
  if (!secs) return '';
  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  return h > 0 ? `${h}h${m}m` : `${m}m`;
}

function renderZonesLegend(hrZones) {
  if (!hrZones || hrZones.length === 0) return;
  const el = document.getElementById('zonesLegend');
  el.innerHTML = hrZones.map((z, i) => `
    <div class="legend-row">
      <div class="zone-dot" style="background:${ZONE_COLORS[i]}"></div>
      <div class="legend-name">Z${i+1} · ${ZONE_NAMES[i] || ''}</div>
      <div class="legend-range">${z.min}–${z.max === -1 ? '∞' : z.max} bpm</div>
    </div>
  `).join('');
  showSection('zonesSection');
}

function renderActivities(activities) {
  const list = document.getElementById('activitiesList');
  list.innerHTML = activities.map(a => {
    const icon  = SPORT_ICONS[a.sport] || '🏃';
    const color = SPORT_COLORS[a.sport] || 'rgba(255,255,255,0.08)';
    const totalTime = a.buckets.reduce((s, b) => s + (b.time || 0), 0) || 1;

    // Zone bar segments
    const segments = a.buckets.slice(0, 5).map((b, i) => {
      const pct = Math.round((b.time || 0) / totalTime * 100);
      return pct > 0
        ? `<div class="zone-seg" style="flex:${pct};background:${ZONE_COLORS[i]}"></div>`
        : '';
    }).join('');

    // Zone chips below bar
    const chips = a.buckets.slice(0, 5).map((b, i) => {
      const pct = Math.round((b.time || 0) / totalTime * 100);
      if (pct === 0) return '';
      return `
        <div class="zone-chip">
          <div class="zone-chip-dot" style="background:${ZONE_COLORS[i]}"></div>
          Z${i+1} ${pct}%
        </div>`;
    }).join('');

    const hasZones = a.buckets.length > 0 && totalTime > 1;
    const distStr  = a.distance > 0 ? `${a.distance} km · ` : '';
    const hrColor  = a.zone ? ZONE_COLORS[a.zone - 1] : 'var(--text)';

    return `
      <div class="activity-card">
        <div class="activity-header">
          <div class="sport-icon" style="background:${color}">${icon}</div>
          <div class="activity-meta">
            <div class="activity-name">${a.name}</div>
            <div class="activity-sub">${a.date} · ${distStr}${a.duration} min</div>
          </div>
          ${a.avg_hr ? `
            <div class="activity-hr">
              <div class="hr-value" style="color:${hrColor}">${Math.round(a.avg_hr)}</div>
              <div class="hr-label">avg bpm</div>
            </div>` : ''}
        </div>
        ${hasZones ? `
          <div class="zone-bars">${segments}</div>
          <div class="zone-breakdown">${chips}</div>
        ` : `<div style="font-size:11px;color:var(--muted)">No HR zone data for this activity</div>`}
      </div>
    `;
  }).join('');

  showSection('activitiesSection');
}

function showSection(id, delay = 0) {
  setTimeout(() => {
    const el = document.getElementById(id);
    el.style.display = 'block';
    requestAnimationFrame(() => el.classList.add('show'));
  }, delay);
}

function renderMarkdown(text) {
  return text
    .replace(/^## (.+)$/gm, '<div style="font-family:\'Bebas Neue\',sans-serif;font-size:16px;letter-spacing:1px;color:#f0f0f0;margin:16px 0 6px">$1</div>')
    .replace(/^- \*\*(.+?)\*\*: (.+)$/gm, '<div style="margin-bottom:8px"><span style="color:#f0f0f0;font-weight:500">$1:</span> $2</div>')
    .replace(/\*\*(.+?)\*\*/g, '<span style="color:#f0f0f0;font-weight:500">$1</span>')
    .replace(/^- (.+)$/gm, '<div style="margin-bottom:6px;padding-left:12px;border-left:2px solid var(--orange)">$1</div>')
    .replace(/\n\n/g, '<div style="height:8px"></div>')
    .replace(/\n/g, ' ');
}

async function analyze() {
  const btn   = document.getElementById('analyzeBtn');
  const loading = document.getElementById('loading');
  const errorCard = document.getElementById('errorCard');

  // Reset
  btn.disabled = true;
  loading.classList.add('active');
  errorCard.classList.remove('active');
  ['statsRow','zonesSection','activitiesSection','analysisSection'].forEach(id => {
    const el = document.getElementById(id);
    el.classList.remove('show');
    if (id !== 'statsRow') el.style.display = 'none';
  });

  let stepIdx = 0;
  const stepEl = document.getElementById('loadingStep');
  stepEl.textContent = steps[0];
  const timer = setInterval(() => {
    stepIdx = (stepIdx + 1) % steps.length;
    stepEl.textContent = steps[stepIdx];
  }, 2500);

  try {
    const res  = await fetch('/analyze', { method: 'POST' });
    const data = await res.json();
    clearInterval(timer);
    loading.classList.remove('active');

    if (data.success) {
      // Stats
      document.getElementById('statRuns').textContent     = data.stats.total_runs;
      document.getElementById('statKm').textContent       = data.stats.total_km;
      document.getElementById('statSessions').textContent = data.stats.activities;
      document.getElementById('statsRow').classList.add('show');

      // Render
      renderZonesLegend(data.hr_zones);
      renderActivities(data.activities);

      document.getElementById('analysisText').innerHTML = renderMarkdown(data.analysis);
      showSection('analysisSection', 200);
    } else {
      errorCard.textContent = '❌ ' + data.error;
      errorCard.classList.add('active');
      console.error(data.trace);
    }
  } catch(e) {
    clearInterval(timer);
    loading.classList.remove('active');
    errorCard.textContent = '❌ Could not connect to server. Make sure server.py is running.';
    errorCard.classList.add('active');
  }

  btn.disabled = false;
}
</script>
</body>
</html>
