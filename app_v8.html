<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TrainAI">
<title>TrainAI</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { background:#f5f5f0; color:#1a1a1a; font-family:'DM Sans',sans-serif; min-height:100vh; }
.page { max-width:430px; margin:0 auto; padding-bottom:100px; }

/* Header */
.hdr { background:#fff; padding:max(env(safe-area-inset-top),20px) 18px 0; border-bottom:1px solid #ebebeb; position:sticky; top:0; z-index:10; }
.hdr-top { display:flex; align-items:center; justify-content:space-between; padding-bottom:12px; }
.logo { display:flex; align-items:center; gap:9px; }
.logo-dot { width:9px; height:9px; border-radius:50%; background:#FC4C02; }
.logo-name { font-size:16px; font-weight:600; letter-spacing:-.3px; }
.logo-name span { color:#FC4C02; }
.logo-sub { font-size:11px; color:#bbb; margin-top:1px; }
.go-btn { background:#FC4C02; color:#fff; border:none; border-radius:18px; padding:7px 16px; font-family:'DM Sans',sans-serif; font-size:13px; font-weight:500; cursor:pointer; }
.go-btn:active { opacity:.8; }
.go-btn:disabled { opacity:.45; cursor:not-allowed; }

/* Tabs */
.tabs { display:flex; }
.tab { flex:1; padding:10px 0 11px; font-size:13px; font-weight:500; color:#aaa; text-align:center; cursor:pointer; border-bottom:2px solid transparent; transition:all .2s; }
.tab.active { color:#FC4C02; border-bottom-color:#FC4C02; }

/* Progress */
.prog { height:2px; background:#f0ede8; display:none; }
.prog.on { display:block; }
.prog-fill { height:100%; background:#FC4C02; animation:prg 1.8s ease-in-out infinite; }
@keyframes prg { 0%{width:0%;margin-left:0} 50%{width:60%;margin-left:20%} 100%{width:0%;margin-left:100%} }
.prog-msg { text-align:center; padding:9px; font-size:11px; color:#bbb; display:none; }
.prog-msg.on { display:block; }

.err { margin:12px 16px; background:#fff5f5; border:1px solid #ffd0d0; border-radius:10px; padding:11px 14px; font-size:12px; color:#c0392b; display:none; }
.err.on { display:block; }

/* Summary card */
.sum-card { margin:14px 16px 0; background:#fff; border-radius:14px; border:1px solid #ebebeb; overflow:hidden; }
.sum-top { padding:14px 16px 12px; border-bottom:1px solid #f5f5f5; }
.sum-label { font-size:10px; font-weight:500; color:#bbb; text-transform:uppercase; letter-spacing:.8px; margin-bottom:10px; }
.sum-stats { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
.sstat { text-align:center; background:#f9f9f9; border-radius:8px; padding:8px 4px; }
.sstat-v { font-size:18px; font-weight:600; color:#1a1a1a; line-height:1; }
.sstat-l { font-size:9px; color:#bbb; margin-top:2px; text-transform:uppercase; letter-spacing:.4px; }

/* Weekly summary text */
.week-text { padding:12px 16px; border-bottom:1px solid #f5f5f5; font-size:12px; color:#666; line-height:1.6; }

/* Zone rows in summary */
.sum-zones { padding:12px 16px 14px; }
.sz-label { font-size:10px; font-weight:500; color:#bbb; text-transform:uppercase; letter-spacing:.8px; margin-bottom:10px; }
.sz-rows { display:flex; flex-direction:column; gap:6px; }
.sz-row { display:flex; align-items:center; gap:7px; }
.sz-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.sz-name { font-size:11px; color:#999; width:70px; flex-shrink:0; }
.sz-range { font-size:10px; color:#ccc; width:58px; flex-shrink:0; }
.sz-track { flex:1; height:10px; background:#f0ede8; border-radius:5px; overflow:hidden; }
.sz-fill { height:100%; border-radius:5px; }
.sz-time { font-size:11px; font-weight:500; color:#444; width:36px; text-align:right; flex-shrink:0; }
.sz-pct { font-size:10px; color:#ccc; width:26px; text-align:right; flex-shrink:0; }

/* Next workout card */
.next-card { margin:12px 16px 0; background:#fff; border-radius:14px; border:1px solid #ebebeb; overflow:hidden; }
.next-header { padding:12px 16px 10px; border-bottom:1px solid #f5f5f5; display:flex; align-items:center; gap:10px; }
.next-icon { width:34px; height:34px; border-radius:8px; background:#fff3ee; display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0; }
.next-title-wrap { flex:1; }
.next-pill { font-size:9px; font-weight:600; color:#FC4C02; text-transform:uppercase; letter-spacing:.8px; }
.next-title { font-size:14px; font-weight:600; color:#1a1a1a; margin-top:1px; }
.next-body { padding:12px 16px 14px; font-size:12px; color:#666; line-height:1.65; }

/* Section header */
.sec-hdr { padding:16px 16px 8px; display:flex; align-items:center; justify-content:space-between; }
.sec-title { font-size:10px; font-weight:500; color:#bbb; text-transform:uppercase; letter-spacing:.8px; }
.sec-count { font-size:11px; color:#ccc; }

/* Activity card */
.act { margin:0 16px 10px; background:#fff; border-radius:14px; border:1px solid #ebebeb; overflow:hidden; }
.act-top { padding:12px 14px 10px; display:flex; align-items:center; gap:10px; }
.act-icon { width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
.act-info { flex:1; min-width:0; }
.act-name { font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#1a1a1a; }
.act-meta { font-size:11px; color:#bbb; margin-top:1px; }
.act-hr { text-align:right; flex-shrink:0; }
.act-hr-v { font-size:18px; font-weight:600; line-height:1; }
.act-hr-l { font-size:9px; color:#ccc; }

/* Thick zone bar - rounded with padding */
.act-zbar { height:10px; display:flex; background:#f5f5f5; margin:0 14px; border-radius:5px; overflow:hidden; }
.act-zseg { height:100%; }

/* Highlight banner */
.act-highlight {
  padding:9px 14px;
  border-top:1px solid #f8f8f8;
  display:flex; align-items:flex-start; gap:8px;
  background:#f9fff9;
}
.highlight-star { font-size:13px; flex-shrink:0; margin-top:1px; }
.highlight-text { font-size:12px; color:#2d7a3a; font-weight:500; line-height:1.5; }

/* Description & comparison */
.act-desc { padding:8px 14px 0; font-size:12px; color:#666; line-height:1.6; border-top:1px solid #f8f8f8; }
.act-compare { padding:6px 14px 10px; font-size:11px; color:#aaa; line-height:1.5; font-style:italic; }

/* Zone rows */
.act-zones { padding:9px 14px 11px; border-top:1px solid #f8f8f8; }
.zrow { display:flex; align-items:center; gap:7px; padding:3px 0; }
.zrow-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.zrow-name { font-size:10px; color:#aaa; width:70px; flex-shrink:0; }
.zrow-range { font-size:10px; color:#ddd; width:56px; flex-shrink:0; }
.zrow-track { flex:1; height:8px; background:#f0ede8; border-radius:4px; overflow:hidden; }
.zrow-fill { height:100%; border-radius:4px; }
.zrow-time { font-size:10px; font-weight:500; color:#555; width:30px; text-align:right; flex-shrink:0; }
.zrow-pct { font-size:10px; color:#ccc; width:24px; text-align:right; flex-shrink:0; }
.est-note { font-size:9px; color:#ddd; padding-top:5px; }

.refresh { width:calc(100% - 32px); margin:0 16px 16px; display:block; background:transparent; border:1px solid #ebebeb; color:#ccc; border-radius:9px; padding:10px; font-family:'DM Sans',sans-serif; font-size:12px; cursor:pointer; }
.footer { text-align:center; padding:16px 0; font-size:10px; color:#ddd; }
.footer span { color:#FC4C02; }
</style>
</head>
<body>
<div class="page">

  <div class="hdr">
    <div class="hdr-top">
      <div class="logo">
        <div class="logo-dot"></div>
        <div>
          <div class="logo-name">Train<span>AI</span></div>
          <div class="logo-sub">Strava · Apple Watch</div>
        </div>
      </div>
      <button class="go-btn" id="mainBtn" onclick="analyze()">Analyze</button>
    </div>
    <div class="tabs">
      <div class="tab active" id="tabWeek" onclick="switchTab('week')">This week</div>
      <div class="tab" id="tabMonth" onclick="switchTab('month')">This month</div>
      <div class="tab" id="tabAll" onclick="switchTab('all')">All recent</div>
    </div>
  </div>

  <div class="prog" id="prog"><div class="prog-fill"></div></div>
  <div class="prog-msg" id="progMsg">Loading...</div>
  <div class="err" id="err"></div>

  <!-- Summary -->
  <div id="sumWrap" style="display:none">
    <div class="sum-card">
      <div class="sum-top">
        <div class="sum-label" id="sumLabel">This week</div>
        <div class="sum-stats">
          <div class="sstat"><div class="sstat-v" id="sW">—</div><div class="sstat-l">workouts</div></div>
          <div class="sstat"><div class="sstat-v" id="sK">—</div><div class="sstat-l">km run</div></div>
          <div class="sstat"><div class="sstat-v" id="sM">—</div><div class="sstat-l">minutes</div></div>
          <div class="sstat"><div class="sstat-v" id="sS">—</div><div class="sstat-l">strength</div></div>
        </div>
      </div>
      <div class="week-text" id="weekText"></div>
      <div class="sum-zones">
        <div class="sz-label">Total time in HR zones</div>
        <div class="sz-rows" id="szRows"></div>
      </div>
    </div>
  </div>

  <!-- Next workout -->
  <div id="nextWrap" style="display:none">
    <div class="next-card">
      <div class="next-header">
        <div class="next-icon" id="nextIcon">🏃</div>
        <div class="next-title-wrap">
          <div class="next-pill">Recommended next workout</div>
          <div class="next-title" id="nextTitle">—</div>
        </div>
      </div>
      <div class="next-body" id="nextBody"></div>
    </div>
  </div>

  <!-- Activities -->
  <div id="actsWrap" style="display:none">
    <div class="sec-hdr">
      <div class="sec-title">Workouts</div>
      <div class="sec-count" id="actCount"></div>
    </div>
    <div id="actsList"></div>
  </div>

  <button class="refresh" id="refreshBtn" onclick="analyze()" style="display:none">Refresh analysis</button>
  <div class="footer" id="footer" style="display:none">Made for <span>You</span> · TrainAI v8.0</div>
</div>

<script>
// Apple Workout app zone colors
const ZC = ['#5ac8fa','#4cd964','#ffcc00','#ff9500','#ff3b30'];
const ZN = ['Recovery','Endurance','Tempo','Threshold','Max'];
const ZR = ['<124 bpm','124–154 bpm','154–169 bpm','169–184 bpm','184+ bpm'];
const ZB = [0,124,154,169,184,999];
const WI = {Run:'🏃',Walk:'🚶',WeightTraining:'🏋️',Ride:'🚴',Hike:'🥾',Swim:'🏊'};
const WBg= {Run:'#fff5f0',Walk:'#f0f5ff',WeightTraining:'#f0fff8',Ride:'#fffbf0'};
const STEPS=['Fetching Strava...','Processing workouts...','Computing HR zones...','Generating AI insights...','Almost done...'];

let allActs=[], allNext={}, allWeekText='', curTab='week';

function fmtTime(s){
  if(!s||s<30) return '';
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);
  return h>0?`${h}h ${m}m`:`${m}m`;
}

function getZone(hr){
  if(!hr) return -1;
  for(let i=0;i<5;i++) if(hr>=ZB[i]&&hr<ZB[i+1]) return i;
  return 4;
}

function estimateZones(avgHr, durationMins, sport){
  if(!avgHr||!durationMins) return null;

  // Walks stay entirely in Z1 — HR never reaches 124bpm walking
  if(sport === 'Walk') {
    const secs = durationMins * 60;
    return [secs, 0, 0, 0, 0];
  }

  const z=getZone(avgHr);
  const zmin=ZB[z], zmax=ZB[z+1]<500?ZB[z+1]:ZB[z]+20;
  const pos=(avgHr-zmin)/(zmax-zmin);
  const distFromEdge = Math.min(pos, 1-pos);
  const spillFactor = distFromEdge * 0.3;
  const mainW = 1.0 - spillFactor * 2;
  const sDn = spillFactor * (1-pos);
  const sUp = spillFactor * pos;

  const w=[0,0,0,0,0];
  w[z]=mainW;
  if(z>0) w[z-1]+=sDn; else w[z]+=sDn;
  if(z<4) w[z+1]+=sUp; else w[z]+=sUp;

  const secs=durationMins*60;
  return w.map(v=>Math.round(v*secs));
}

function filterByTab(acts){
  const now=new Date();
  if(curTab==='week'){ const d=new Date(now); d.setDate(now.getDate()-7); return acts.filter(a=>new Date(a.date)>=d); }
  if(curTab==='month'){ const d=new Date(now); d.setDate(now.getDate()-30); return acts.filter(a=>new Date(a.date)>=d); }
  return acts;
}

function switchTab(t){
  curTab=t;
  ['week','month','all'].forEach(x=>{
    document.getElementById('tab'+x.charAt(0).toUpperCase()+x.slice(1)).classList.toggle('active',x===t);
  });
  if(allActs.length>0) renderAll();
}

function renderSummary(acts){
  const labels={week:'This week',month:'This month',all:'All recent'};
  document.getElementById('sumLabel').textContent=labels[curTab];
  const runs=acts.filter(a=>a.sport==='Run');
  const wts=acts.filter(a=>a.sport==='WeightTraining');
  const km=runs.reduce((s,a)=>s+a.distance,0);
  const mins=acts.reduce((s,a)=>s+a.duration,0);
  document.getElementById('sW').textContent=acts.length;
  document.getElementById('sK').textContent=km.toFixed(1);
  document.getElementById('sM').textContent=Math.round(mins);
  document.getElementById('sS').textContent=wts.length;
  document.getElementById('weekText').textContent=allWeekText;

  const totals=[0,0,0,0,0];
  acts.forEach(a=>{ const e=estimateZones(a.avg_hr,a.duration,a.sport); if(e) e.forEach((t,i)=>totals[i]+=t); });
  const grand=totals.reduce((s,t)=>s+t,0)||1;
  const maxT=Math.max(...totals,1);

  document.getElementById('szRows').innerHTML=totals.map((t,i)=>{
    if(t<30) return '';
    const pct=Math.round(t/grand*100), bw=Math.round(t/maxT*100);
    return `<div class="sz-row">
      <div class="sz-dot" style="background:${ZC[i]}"></div>
      <div class="sz-name">Z${i+1} ${ZN[i]}</div>
      <div class="sz-range">${ZR[i]}</div>
      <div class="sz-track"><div class="sz-fill" style="width:${bw}%;background:${ZC[i]}"></div></div>
      <div class="sz-time">${fmtTime(t)}</div>
      <div class="sz-pct">${pct}%</div>
    </div>`;
  }).filter(Boolean).join('');

  document.getElementById('sumWrap').style.display='block';
}

function renderNext(next){
  if(!next||!next.title) return;
  const icon=WI[next.type]||'🏃';
  document.getElementById('nextIcon').textContent=icon;
  document.getElementById('nextTitle').textContent=next.title;
  document.getElementById('nextBody').textContent=next.description;
  document.getElementById('nextWrap').style.display='block';
}

function renderActivities(acts){
  document.getElementById('actCount').textContent=`${acts.length} workouts`;
  document.getElementById('actsList').innerHTML=acts.map(a=>{
    const icon=WI[a.sport]||'🏃';
    const bg=WBg[a.sport]||'#f9f9f9';
    const zone=getZone(a.avg_hr);
    const hrClr=a.avg_hr?ZC[zone]:'#ccc';
    const dist=a.distance>0?`${a.distance}km · `:'';
    const zt=estimateZones(a.avg_hr,a.duration,a.sport);
    const total=zt?zt.reduce((s,t)=>s+t,0):0;
    const maxT=zt?Math.max(...zt,1):1;

    const barSegs=zt&&total>0
      ?zt.map((t,i)=>{const p=t/total*100;return p>0.5?`<div class="act-zseg" style="flex:${p};background:${ZC[i]}"></div>`:''}).join('')
      :'';

    const zrows=zt&&total>0
      ?zt.map((t,i)=>{
        if(t<30) return '';
        const p=Math.round(t/total*100),bw=Math.round(t/maxT*100);
        return `<div class="zrow">
          <div class="zrow-dot" style="background:${ZC[i]}"></div>
          <div class="zrow-name">Z${i+1} ${ZN[i]}</div>
          <div class="zrow-range">${ZR[i]}</div>
          <div class="zrow-track"><div class="zrow-fill" style="width:${bw}%;background:${ZC[i]}"></div></div>
          <div class="zrow-time">${fmtTime(t)}</div>
          <div class="zrow-pct">${p}%</div>
        </div>`;
      }).filter(Boolean).join('')
      :'';

    return `<div class="act">
      <div class="act-top">
        <div class="act-icon" style="background:${bg}">${icon}</div>
        <div class="act-info">
          <div class="act-name">${a.name}</div>
          <div class="act-meta">${a.date} · ${dist}${Math.round(a.duration)} min</div>
        </div>
        ${a.avg_hr?`<div class="act-hr">
          <div class="act-hr-v" style="color:${hrClr}">${Math.round(a.avg_hr)}</div>
          <div class="act-hr-l">avg bpm</div>
        </div>`:''}
      </div>
      ${barSegs?`<div class="act-zbar">${barSegs}</div>`:''}
      ${a.highlight?`<div class="act-highlight"><div class="highlight-star">★</div><div class="highlight-text">${a.highlight}</div></div>`:''}
      ${a.description?`<div class="act-desc">${a.description}</div>`:''}
      ${a.comparison?`<div class="act-compare">${a.comparison}</div>`:''}
      ${zrows?`<div class="act-zones">${zrows}<div class="est-note">⚡ Estimated from avg HR</div></div>`:''}
    </div>`;
  }).join('');
  document.getElementById('actsWrap').style.display='block';
}

function renderAll(){
  const filtered=filterByTab(allActs);
  ['sumWrap','nextWrap','actsWrap'].forEach(id=>document.getElementById(id).style.display='none');
  document.getElementById('err').classList.remove('on');

  if(filtered.length===0){
    document.getElementById('err').textContent='No workouts found for this period.';
    document.getElementById('err').classList.add('on');
    return;
  }
  renderSummary(filtered);
  renderNext(allNext);
  renderActivities(filtered);
  document.getElementById('refreshBtn').style.display='block';
  document.getElementById('footer').style.display='block';
}

async function analyze(){
  const btn=document.getElementById('mainBtn');
  btn.disabled=true;
  document.getElementById('prog').classList.add('on');
  document.getElementById('progMsg').classList.add('on');
  document.getElementById('err').classList.remove('on');
  ['sumWrap','nextWrap','actsWrap','refreshBtn','footer'].forEach(id=>document.getElementById(id).style.display='none');

  let si=0;
  const msgEl=document.getElementById('progMsg');
  msgEl.textContent=STEPS[0];
  const timer=setInterval(()=>{msgEl.textContent=STEPS[++si%STEPS.length];},2200);

  try{
    const res=await fetch('/analyze',{method:'POST'});
    const data=await res.json();
    clearInterval(timer);
    document.getElementById('prog').classList.remove('on');
    document.getElementById('progMsg').classList.remove('on');

    if(data.success){
      allActs=data.activities;
      allNext=data.next_workout||{};
      allWeekText=data.weekly_summary||'';
      renderAll();
    } else {
      document.getElementById('err').textContent=data.error;
      document.getElementById('err').classList.add('on');
      console.error(data.trace);
    }
  } catch(e){
    clearInterval(timer);
    document.getElementById('prog').classList.remove('on');
    document.getElementById('progMsg').classList.remove('on');
    document.getElementById('err').textContent='Cannot connect to server. Make sure server_v8.py is running.';
    document.getElementById('err').classList.add('on');
  }
  btn.disabled=false;
}
</script>
</body>
</html>
